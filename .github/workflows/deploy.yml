name: Build and deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.157.0
      NODE_VERSION: 24.12.0
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Validate search crawler files
        run: python3 scripts/validate_search_files.py public
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public crawler endpoints
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base_url="${SITE_URL%/}"
          googlebot='Googlebot/2.1 (+http://www.google.com/bot.html)'

          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --user-agent "${googlebot}" \
            "${base_url}/sitemap.xml?deploy=${GITHUB_SHA}" \
            --output /tmp/sitemap.xml

          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --user-agent "${googlebot}" \
            "${base_url}/robots.txt?deploy=${GITHUB_SHA}" \
            --output /tmp/robots.txt

          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          base_url = os.environ["SITE_URL"].rstrip("/")
          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          root = ET.fromstring(Path("/tmp/sitemap.xml").read_text(encoding="utf-8"))
          if root.tag != f"{{{namespace}}}urlset":
              raise SystemExit("Public sitemap.xml does not contain a valid urlset")

          locations = {
              (node.text or "").strip()
              for node in root.findall(f".//{{{namespace}}}loc")
          }
          required = {
              f"{base_url}/",
              f"{base_url}/posts/",
              f"{base_url}/profile/",
              f"{base_url}/resume/",
          }
          if not required.issubset(locations):
              raise SystemExit(
                  f"Public sitemap.xml is missing required URLs: {sorted(required - locations)}"
              )

          robots = Path("/tmp/robots.txt").read_text(encoding="utf-8")
          expected_sitemap = f"Sitemap: {base_url}/sitemap.xml"
          if "User-agent: *" not in robots or expected_sitemap not in robots:
              raise SystemExit("Public robots.txt does not advertise the canonical sitemap")
          PY
