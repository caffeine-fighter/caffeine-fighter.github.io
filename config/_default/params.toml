# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"
description    = "개발·연구·음악·학생 조직 운영 과정에서 문제를 분석하고 결과물을 만드는 과정을 기록하는 개인 블로그입니다."

[author]
    name   = "카페인파이터"
    url    = "https://caffeine-fighter.github.io/profile/"
    sameAs = [
        "https://github.com/caffeine-fighter",
        "https://www.instagram.com/caffeine.fighter",
    ]

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = ""
    subtitle = "SNU TI & Math & Music & CSE 24"
    avatar   = "img/profile-110007411.jpg"

    [sidebar.status]
        updated       = "2026.07.29"
        ongoingCount  = 2
        upcomingCount = 10
        ongoing       = ["SNU FastMRI", "SNU AI Challenge"]
        upcoming      = [
            "OGC 2026",
            "AGENT:24",
            "KB AI Challenge",
            "BARAM 2026",
            "NHN NAN 2026",
            "MABC 2026",
            "반도체 STOB 리그",
            "AI 반도체 회로설계",
            "2026 금융 AI Challenge",
            "극지 빅데이터·AI",
        ]

[home.banner]
    kicker     = "CF / PERSONAL POSTS / 2026"
    title      = "경계를 넘나들며"
    accent     = "결과를 만드는 기록."
    description = "수학과 소프트웨어, 생성형 AI 연구, 음악 창작과 조직 운영. 서로 다른 세계에서 마주친 문제를 분석하고 직접 만든 결과로 증명해 온 과정을 남깁니다."

    [[home.banner.metrics]]
        label = "BUILD"
        value = "2× Hackathon Grand Prize"

    [[home.banner.metrics]]
        label = "OPERATE"
        value = "1,000+ Community"

    [[home.banner.metrics]]
        label = "STUDY"
        value = "4.10 Major GPA"

    [home.banner.orbit]
        eyebrow = "CF / TRACK RECORD"
        caption = "RATINGS · ENTRIES / AWARDS · GPA"

        [[home.banner.orbit.stats]]
            label  = "PS"
            value  = "2,415"
            detail = "solved.ac AC Rating · pleiades1"
            url    = "https://solved.ac/profile/pleiades1"

        [[home.banner.orbit.stats]]
            label  = "CP"
            value  = "1,937"
            detail = "Codeforces Rating · PastelRain"
            url    = "https://codeforces.com/profile/PastelRain"

        [[home.banner.orbit.stats]]
            label  = "HACK"
            value  = "5 / 2"
            detail = "해커톤 출전 5회 · 수상 2회"
            url    = "/profile/#대회와-수상"

        [[home.banner.orbit.stats]]
            label  = "ML"
            value  = "4 / 1"
            detail = "ML·AI 대회 출전 4회 · 수상 1회"
            url    = "/profile/#대회와-수상"

        [[home.banner.orbit.stats]]
            label  = "MUSIC"
            value  = "8"
            detail = "완성한 음악 작업물 8곡"
            url    = "/profile/"

        [[home.banner.orbit.stats]]
            label  = "GPA"
            value  = "3.83 / 4.10"
            detail = "전체 GPA 3.83 · 전공 GPA 4.10 / 4.30"
            url    = "/resume/"

[article]
    headingAnchor = false
    math          = true
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled  = true
    provider = "giscus" 

    [comments.giscus]
        repo = "caffeine-fighter/caffeine-fighter.github.io"
        repoId = "R_kgDORaF3hg"
        category = "Announcements"
        categoryId = "DIC_kwDORaF3hs4C3cX0"
        mapping = "pathname"
        strict = "0"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "bottom"
        lightTheme = "https://caffeine-fighter.github.io/css/giscus-aether-light.css"
        darkTheme = "https://caffeine-fighter.github.io/css/giscus-aether-dark.css"
        lang = "ko"
        loading = "lazy"
        crossorigin = "anonymous"
