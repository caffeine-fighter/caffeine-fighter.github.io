{{- with .Site.Params.comments.giscus -}}
<section class="comments" data-giscus-shell aria-labelledby="comments-title" aria-busy="true">
    <header class="comments__header">
        <h2 id="comments-title">댓글</h2>
        <p>GitHub 계정으로 남길 수 있고, GitHub Discussions에 저장됩니다.</p>
    </header>
    <div class="comments__frame">
        <p class="comments__loading" role="status">댓글을 불러오는 중…</p>
        <script
            src="https://giscus.app/client.js"
            data-repo="{{- .repo -}}"
            data-repo-id="{{- .repoID -}}"
            data-category="{{- .category -}}"
            data-category-id="{{- .categoryID -}}"
            data-mapping="{{- .mapping -}}"
            data-strict="{{- .strict -}}"
            data-reactions-enabled="{{- .reactionsEnabled -}}"
            data-emit-metadata="{{- .emitMetadata -}}"
            data-input-position="{{- .inputPosition -}}"
            data-theme="{{- .lightTheme -}}"
            data-lang="{{- .lang -}}"
            data-loading="{{- .loading -}}"
            crossorigin="anonymous"
            async
        ></script>
    </div>
</section>
<script>
    (() => {
        const currentScript = document.currentScript;
        const shell = currentScript.previousElementSibling;
        const frame = shell?.querySelector(".comments__frame");
        if (!shell || !frame) return;

        const theme = () =>
            document.documentElement.dataset.scheme === "light"
                ? "{{- .lightTheme -}}"
                : "{{- .darkTheme -}}";

        const setTheme = () => {
            const giscus = shell.querySelector("iframe.giscus-frame");
            if (!giscus?.contentWindow) return;

            giscus.contentWindow.postMessage(
                { giscus: { setConfig: { theme: theme() } } },
                "https://giscus.app"
            );
        };

        const markReady = () => {
            shell.classList.add("is-ready");
            shell.setAttribute("aria-busy", "false");
        };

        const connectFrame = () => {
            const giscus = shell.querySelector("iframe.giscus-frame");
            if (!giscus || giscus.dataset.giscusConnected) return;

            giscus.dataset.giscusConnected = "true";
            giscus.addEventListener(
                "load",
                () => {
                    setTheme();
                    markReady();
                },
                { once: true }
            );
            setTheme();
        };

        const observer = new MutationObserver(connectFrame);
        observer.observe(frame, { childList: true, subtree: true });
        connectFrame();

        window.addEventListener("message", (event) => {
            if (event.origin !== "https://giscus.app") return;
            setTheme();
            markReady();
        });
        window.addEventListener("onColorSchemeChange", setTheme);

        window.setTimeout(() => {
            connectFrame();
            if (shell.querySelector("iframe.giscus-frame")) markReady();
        }, 5000);
    })();
</script>
{{- end -}}
