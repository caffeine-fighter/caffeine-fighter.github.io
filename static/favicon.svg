  <rect width="512" height="512" rx="156" fill="url(#background)"/>
  <circle cx="256" cy="256" r="183" fill="#806ed7" opacity=".22" filter="url(#aura)"/>
  <circle cx="256" cy="256" r="176" fill="url(#orb)" stroke="#d9d1ff" stroke-opacity=".22" stroke-width="3"/>

  <path
