<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="70" y1="54" x2="448" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21163e"/>
      <stop offset=".52" stop-color="#130d29"/>
      <stop offset="1" stop-color="#2b1230"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(208 174) rotate(49) scale(248)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".42" stop-color="#9d8df1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#624d91" stop-opacity=".08"/>
    </radialGradient>
    <linearGradient id="blue" x1="128" y1="126" x2="316" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86d8ff"/>
      <stop offset=".52" stop-color="#6099ff"/>
      <stop offset="1" stop-color="#8c77e9"/>
    </linearGradient>
    <linearGradient id="ruby" x1="382" y1="142" x2="190" y2="382" gradientUnits="userSpaceOnUse">
